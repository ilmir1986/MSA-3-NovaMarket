worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format cb_debug '$remote_addr - $request - upstream_status:$upstream_status - status:$status';

    # =====================================================================
    # Rate Limiter Zones
    # =====================================================================
    limit_req_zone $binary_remote_addr zone=web_limit:10m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=mobile_limit:10m rate=30r/s;

    map $http_client_type $client_category {
        default     "mobile";
        "web"       "web";
        "mobile"    "mobile";
    }

    # =====================================================================
    # Upstreams
    # =====================================================================
    upstream backend {
        server 127.0.0.1:8081;
    }

    upstream logistics_backend {
        server 127.0.0.1:9090 max_fails=5 fail_timeout=30s;
    }

    # =====================================================================
    # Server: API Gateway (порт 80)
    # =====================================================================
    server {
        listen 80;
        server_name _;
        access_log /dev/stdout cb_debug;

        # --- Rate Limiter: /api/ ---
        location /api/ {
            if ($client_category = "web") {
                rewrite ^/api/(.*)$ /_internal_web/$1 last;
            }
            if ($client_category = "mobile") {
                rewrite ^/api/(.*)$ /_internal_mobile/$1 last;
            }
            # Fallback: если заголовок не передан — mobile-лимит
            limit_req zone=mobile_limit burst=5 nodelay;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Client-Type $http_client_type;
        }

        location /_internal_web/ {
            internal;
            # burst=5: 50 r/s + 5 burst = 55 запросов максимум, 56-й → 503
            limit_req zone=web_limit burst=5 nodelay;
            rewrite ^/_internal_web/(.*)$ /api/$1 break;
            proxy_pass http://backend;
            proxy_set_header X-Client-Type "web";
            proxy_set_header Host $host;
        }

        location /_internal_mobile/ {
            internal;
            # burst=3: 30 r/s + 3 burst = 33 запроса максимум, 34-й → 503
            limit_req zone=mobile_limit burst=3 nodelay;
            rewrite ^/_internal_mobile/(.*)$ /api/$1 break;
            proxy_pass http://backend;
            proxy_set_header X-Client-Type "mobile";
            proxy_set_header Host $host;
        }

        # --- Circuit Breaker: /logistics/ ---
        location /logistics/ {
            proxy_intercept_errors on;
            proxy_connect_timeout 3s;
            proxy_send_timeout 3s;
            proxy_read_timeout 3s;
            proxy_next_upstream off;
            proxy_pass http://logistics_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;

            error_page 502 =503 @circuit_breaker_fallback;
            error_page 504 =503 @circuit_breaker_fallback;
        }

        location @circuit_breaker_fallback {
            internal;
            default_type application/json;
            add_header X-Circuit-Breaker open always;
            return 503 '{"status":"error","error":"circuit_breaker_open","message":"Logistics service temporarily unavailable"}';
        }

        location /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok","service":"nginx-proxy"}';
        }
    }

    # =====================================================================
    # Test Backend Mock (порт 8081)
    # =====================================================================
    server {
        listen 127.0.0.1:8081;
        server_name _;

        location /api/ {
            default_type application/json;
            if ($http_client_type = "web") {
                return 200 '{"status":"success","service":"web_backend","data":"Web application response"}';
            }
            if ($http_client_type = "mobile") {
                return 200 '{"status":"success","service":"mobile_backend","data":"Mobile application response"}';
            }
            return 200 '{"status":"success","service":"default_backend","data":"Default response"}';
        }
    }

    # =====================================================================
    # Test Logistics Mock (порт 9090)
    # =====================================================================
    server {
        listen 127.0.0.1:9090;
        server_name _;

        location / {
            default_type application/json;
            if ($arg_type = "fast") {
                return 200 '{"status":"success","service":"logistics","response_time":"fast","tracking_id":"TRK_FAST_123"}';
            }
            if ($arg_type = "slow") {
                return 504 '{"status":"timeout","service":"logistics","message":"Simulated gateway timeout"}';
            }
            if ($arg_type = "error") {
                return 500 '{"status":"error","service":"logistics","error_code":"INTERNAL_ERROR"}';
            }
            return 200 '{"status":"success","service":"logistics","data":{"tracking_id":"TRK123456"}}';
        }

        location = /fast {
            default_type application/json;
            return 200 '{"status":"success","endpoint":"fast","message":"Quick response"}';
        }

        location = /slow {
            default_type application/json;
            return 504 '{"status":"timeout","endpoint":"slow","message":"Simulated gateway timeout","delay":"5000ms"}';
        }

        location = /error {
            default_type application/json;
            return 503 '{"status":"error","endpoint":"error","error":"service_unavailable"}';
        }

        location = /unavailable {
            default_type application/json;
            return 500 '{"status":"error","endpoint":"unavailable","error":"internal_server_error"}';
        }

        location /health {
            default_type application/json;
            return 200 '{"status":"ok","service":"logistics-mock"}';
        }
    }
}