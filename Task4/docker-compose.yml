services:
  nginx:
    image: nginx:1.25-alpine
    ports:
      - "80:80"
      - "8081:8081"
      - "9090:9090"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    command: >
      sh -c "nginx -t && nginx -g 'daemon off;'"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 5s
      timeout: 2s
      retries: 3